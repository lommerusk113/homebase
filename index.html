<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homebase</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#ffffff; --canvas:#f6f8fa; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --line-soft:#e6ebf1;
    --hover:#f3f5f8; --accent:#0969da; --accent-bg:#ddf4ff; --chip:#eff2f5; --strong:#000;
    --c-doing:#0969da; --c-needs:#bc4c00; --c-review:#8250df; --c-ready:#1a7f37; --c-done:#59636e; --c-idle:#8c959f;
    --shadow:0 8px 24px rgba(140,149,159,.2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1117; --canvas:#010409; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --line-soft:#21262d;
      --hover:#151b23; --accent:#4493f8; --accent-bg:#121d2f; --chip:#212830; --strong:#fff;
      --c-doing:#4493f8; --c-needs:#db6d28; --c-review:#ab7df8; --c-ready:#3fb950; --c-done:#9198a1; --c-idle:#656c76;
      --shadow:0 8px 24px rgba(1,4,9,.75);
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 Inter, -apple-system, system-ui, sans-serif; background:var(--canvas); color:var(--fg); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  .mono { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:11.5px; }
  .muted { color:var(--muted); }

  header.top { background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:12px 24px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; }
  .sep { color:var(--line); font-size:20px; font-weight:300; }
  .select { position:relative; }
  .select select { appearance:none; font:inherit; font-weight:600; color:var(--fg); background:var(--canvas); border:1px solid var(--line); border-radius:6px; padding:5px 30px 5px 12px; cursor:pointer; outline:none; }
  .select select:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .select::after { content:''; position:absolute; right:12px; top:50%; width:6px; height:6px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .ghost { white-space:nowrap; appearance:none; font:inherit; font-size:13px; font-weight:500; color:var(--fg); background:var(--canvas); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  .ghost:hover { background:var(--hover); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg); padding:0; width:min(420px, calc(100vw - 32px)); box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(1,4,9,.4); }
  .d-head { display:flex; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  .d-body { max-height:60vh; overflow:auto; padding:8px 0; }
  .d-body h4 { margin:8px 16px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .p-row { display:flex; align-items:center; gap:10px; padding:6px 16px; }
  .p-row:hover { background:var(--hover); }
  .p-row span { flex:1; }
  .p-row small { color:var(--muted); }
  .p-row button { appearance:none; border:1px solid var(--line); background:var(--canvas); color:var(--fg); border-radius:6px; font:inherit; font-size:12px; padding:2px 10px; cursor:pointer; }
  .p-row button.add { color:var(--c-ready); }
  .p-row button.rm { color:var(--c-needs); }
  .d-empty { padding:6px 16px; color:var(--muted); font-size:12.5px; }
  .welcome { margin:auto; text-align:center; color:var(--muted); max-width:360px; }
  .welcome h2 { color:var(--fg); font-size:18px; margin:0 0 6px; }
  .welcome .btn { margin:14px auto 0; }
  .quiet { appearance:none; border:0; background:none; color:var(--muted); font:inherit; font-size:18px; line-height:1; padding:2px 6px; border-radius:6px; cursor:pointer; }
  .quiet:hover { color:var(--fg); background:var(--hover); }
  .quiet:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .offline { margin-left:auto; color:var(--c-needs); font-size:12px; }
  .offline:not([hidden]) + #manage { margin-left:12px !important; }

  .chip { display:inline-flex; align-items:center; gap:4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:1px 8px; border-radius:99px; background:var(--chip); color:var(--fg); font-size:11.5px; line-height:18px; }
  a.chip { text-decoration:none; color:var(--accent); background:var(--accent-bg); }
  a.chip:hover { text-decoration:underline; }
  .pulse { width:7px; height:7px; border-radius:50%; background:var(--c-doing); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }

  .main { flex:1; display:flex; min-height:0; }
  .left { flex:1; min-width:0; display:flex; flex-direction:column; container-type:inline-size; }
  #chat { width:420px; flex-shrink:0; background:var(--bg); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .c-feed { flex:1; overflow:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; background:var(--canvas); }
  .bubble { flex-shrink:0; max-width:92%; border-radius:12px; padding:2px 12px; font-size:13.5px; line-height:1.6; overflow-wrap:anywhere; }
  .bubble.assistant { align-self:flex-start; background:var(--bg); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble.user { align-self:flex-end; max-width:85%; background:var(--accent-bg); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-bottom-right-radius:4px; }
  .bubble .body.fold { max-height:9.6em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent); }
  .bubble .b-note { font-size:11px; color:var(--muted); margin:-6px 0 6px; }
  .bubble.failed { border-color:var(--c-needs); }
  .bubble.failed .b-note { color:var(--c-needs); }
  .show { appearance:none; border:0; background:none; color:var(--accent); font:inherit; font-size:12px; font-weight:500; padding:0 0 8px; cursor:pointer; }
  .lead { margin:8px 0; font-size:14.5px; line-height:1.5; overflow-wrap:anywhere; }
  .lead strong { font-weight:700; color:var(--strong); }
  .lead code { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
  .tools { align-self:flex-start; flex-shrink:0; font-size:12px; color:var(--muted); padding:0 4px; }
  .tools::before { content:'⚙ '; }
  .c-note { margin:0 12px 8px; padding:8px 10px; border-radius:8px; font-size:12.5px; display:flex; gap:8px; align-items:center; }
  .c-ask { background:color-mix(in srgb, var(--c-needs) 14%, var(--bg)); border:1px solid color-mix(in srgb, var(--c-needs) 40%, transparent); }
  .c-ask > span { flex:1; }
  .c-ask code { background:var(--chip); padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .c-working { margin-top:8px; color:var(--muted); }
  .c-input { position:relative; display:flex; padding:10px 12px 12px; border-top:1px solid var(--line); }
  .c-input textarea { flex:1; field-sizing:content; min-height:38px; max-height:180px; resize:none; font:inherit; font-size:13.5px; color:var(--fg); background:var(--canvas); border:1px solid var(--line); border-radius:8px; padding:8px 44px 8px 10px; outline:none; }
  .c-send { position:absolute; right:17px; bottom:17px; width:28px; height:28px; border-radius:50%; border:0; display:grid; place-items:center; background:var(--accent); color:#fff; cursor:pointer; padding:0; }
  .c-send:hover:not(:disabled) { filter:brightness(1.1); }
  .c-send:disabled { opacity:.35; cursor:default; }
  .c-send:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .send-now { appearance:none; margin-left:6px; border:1px solid var(--line); background:var(--bg); color:var(--accent); font:inherit; font-size:11px; font-weight:500; border-radius:99px; padding:0 8px; cursor:pointer; }
  .send-now:hover { background:var(--hover); }
  .c-input textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .c-input textarea:read-only { opacity:.6; }
  #c-err:empty { display:none; }
  #c-err { margin:0 12px 8px; }
  .detail { padding:2px 4px 12px; cursor:default; }
  .detail h4 { margin:12px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .files { list-style:none; margin:0; padding:0; }
  .files li { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:12px; padding:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
  .files li b { color:var(--fg); font-weight:500; }
  .btn { margin-left:auto; appearance:none; display:inline-flex; align-items:center; gap:6px; border:1px solid color-mix(in srgb, var(--c-ready) 60%, black); background:var(--c-ready); color:#fff; font:inherit; font-weight:600; font-size:13px; border-radius:6px; padding:5px 12px; cursor:pointer; white-space:nowrap; }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.6; cursor:default; }
  .error { color:var(--c-needs); font-size:12px; margin-top:6px; }
  .x { appearance:none; border:1px solid var(--line); background:var(--canvas); color:var(--muted); border-radius:6px; width:30px; height:30px; cursor:pointer; font-size:16px; flex-shrink:0; }
  .x:hover { color:var(--fg); }
  .body { font-size:13.5px; line-height:1.6; overflow-wrap:anywhere; }
  .body strong { font-weight:700; color:var(--strong); }
  .body .chip { vertical-align:baseline; }
  .body p, .body ul, .body ol, .body pre, .body table, .body blockquote { margin:10px 0; }
  .body ul, .body ol { padding-left:22px; }
  .body h1, .body h2, .body h3, .body h4 { font-size:14px; margin:14px 0 6px; }
  .body code { font-family:'JetBrains Mono', ui-monospace, monospace; font-size:12px; background:var(--chip); padding:1px 5px; border-radius:4px; }
  .body pre { background:var(--canvas); border:1px solid var(--line); border-radius:6px; padding:10px 12px; overflow:auto; }
  .body pre code { background:none; padding:0; }
  .body table { border-collapse:collapse; font-size:12.5px; }
  .body th, .body td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  .body blockquote { border-left:3px solid var(--line); padding-left:10px; color:var(--muted); }
  .body a { color:var(--accent); }

  .masters { flex:1; overflow:auto; padding:16px 24px 40px; display:flex; flex-direction:column; gap:16px; }
  .move { flex-shrink:0; font-size:13.5px; line-height:22px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .move b { font-weight:600; color:var(--strong); }
  .move .chip { vertical-align:baseline; }
  .move button.chip { appearance:none; border:0; font-family:inherit; cursor:pointer; color:var(--accent); background:var(--accent-bg); }
  .move button.chip.mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
  .move button.chip:hover { text-decoration:underline; }
  .move .sep-dot { color:var(--muted); margin:0 6px; }
  .group { background:var(--bg); border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0; }
  .g-head { display:flex; align-items:center; gap:8px; margin:0; padding:9px 16px; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  summary.g-head { cursor:pointer; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); flex-shrink:0; }
  .dot.live { animation:pulse 1.2s ease-in-out infinite; }
  .rows { width:100%; border-collapse:collapse; table-layout:fixed; border-top:1px solid var(--line); }
  .rows td { padding:8px 12px; border-top:1px solid var(--line-soft); vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .rows tr:first-child td { border-top:0; }
  .rows tr { cursor:pointer; }
  .rows tr:hover { background:var(--hover); }
  .rows tr.sel { background:var(--accent-bg); }
  .rows .what { padding-left:16px; }
  .rows .what b, .rows .what .next { display:block; overflow:hidden; text-overflow:ellipsis; }
  .rows .what b { font-weight:500; }
  .rows .what .next { color:var(--muted); font-size:12px; }
  .rows .pr { width:140px; } .rows .br { width:22%; } .rows .act { width:156px; text-align:right; padding-right:0; }
  .act-btn { font-size:12px; padding:2px 10px; color:var(--muted); }
  .act-btn:hover:not(:disabled) { color:var(--fg); }
  .act-btn:disabled { opacity:.5; cursor:default; } .rows .when { width:60px; text-align:right; color:var(--muted); font-size:12px; padding-right:16px; }
  .rows tr.detail, .rows tr.detail:hover { background:var(--bg); cursor:default; }
  .rows tr.detail td { border-top:0; white-space:normal; overflow:visible; padding:0 16px 4px 16px; }
  .activity { list-style:none; margin:0; padding:0; font-size:12.5px; }
  .activity li { padding:3px 0; color:var(--muted); }
  .activity b { font-weight:500; color:var(--fg); }
  /* zero width, not display:none, so the detail row's colspan still matches the columns */
  @container (max-width: 1000px) { .rows .br { width:0; padding:0; } }
  @container (max-width: 700px) { .rows .pr { width:0; padding:0; } }
  @media (max-width: 900px) {
    .main { flex-direction:column; overflow:auto; }
    .left { flex:none; min-height:60vh; }
    #chat { width:auto; height:80vh; flex-shrink:0; border-left:0; border-top:1px solid var(--line); }
  }

  .rows .prog { width:150px; }
  .stage { display:flex; flex-direction:column; gap:3px; }
  .stage .bar { display:flex; gap:3px; }
  .stage .bar i { flex:1; height:5px; border-radius:3px; background:var(--line-soft); }
  .stage .bar i.on { background:var(--c); }
  .stage .bar i.now { animation:pulse 1.2s ease-in-out infinite; }
  .stage small { font-size:11px; color:var(--muted); line-height:1.2; }

  @media (max-width: 640px) {
    header.top { padding-left:16px; padding-right:16px; }
    .sep { display:none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icon.svg" width="26" height="26" alt="">Homebase</div>
  <span class="sep">/</span>
  <label class="select"><select id="project" aria-label="Project"></select></label>
  <span class="offline" id="offline" hidden>Offline</span>
  <button class="quiet" id="manage" title="Manage projects" aria-label="Manage projects" style="margin-left:auto">☰</button>
</header>
<div class="main">
  <div class="left">
    <div class="masters" id="masters"></div>
  </div>
  <aside id="chat">
    <div class="c-feed" id="feed"></div>
    <div class="c-note c-working" id="working" hidden><span class="pulse"></span>Claude is working…</div>
    <div class="c-note c-ask" id="ask" hidden><span><b>Claude is asking:</b> <span id="ask-q"></span> Answer from any terminal: <code class="mono" id="ask-cmd"></code></span><button class="ghost" id="ask-copy">Copy</button></div>
    <div class="error" id="c-err"></div>
    <form class="c-input" id="send"><textarea id="msg" rows="1" placeholder="Message Claude…"></textarea><button class="c-send" id="send-btn" type="submit" aria-label="Send" title="Send" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
  </aside>
</div>
<dialog id="dlg">
  <div class="d-head">Projects on your board<button class="x" style="margin-left:auto" onclick="this.closest('dialog').close()">×</button></div>
  <div class="d-body" id="dlg-body"></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script>
  const plain = t => (t || '').replace(/[*_`#>]+/g, '').replace(/\s+/g, ' ').trim();
  const md = t => DOMPurify.sanitize(marked.parse(t || ''));
  // Scan aids on rendered markdown: PR/MR links become chips, !123/#123 become chips, file paths become inline code.
  const PR_HREF = /^https:\/\/\S+?\/(?:-\/merge_requests|pull)\/\d+\/?$/;
  const TOKEN = /(^|[\s(\[])((?:~|\.{1,2})?\/[\w.@+-]+(?:\/[\w.@+-]+)+\/?|[\w.@+-]+(?:\/[\w.@+-]+)+\.[a-z]\w{0,5}|[!#]\d+\b)/gi;
  function enrich(root) {
    for (const a of root.querySelectorAll('a')) {
      a.target = '_blank'; a.rel = 'noopener';
      if (PR_HREF.test(a.href) && a.textContent.startsWith('http')) { a.textContent = prLabel(a.href); a.className = 'chip mono'; a.title = a.href; }
    }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('a, code, pre') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const t = n.textContent;
      if (!t.match(TOKEN)) continue;
      const frag = document.createDocumentFragment();
      let last = 0;
      for (const m of t.matchAll(TOKEN)) {
        const start = m.index + m[1].length, tok = m[2].replace(/[.,:;]+$/, '');
        frag.append(t.slice(last, start), /^[!#]/.test(tok) ? el('span', 'chip mono', tok) : el('code', null, tok));
        last = start + tok.length;
      }
      frag.append(t.slice(last));
      n.replaceWith(frag);
    }
    return root;
  }
  const rich = (text, inline) => { const d = el('div', inline ? 'lead' : 'body'); d.innerHTML = DOMPurify.sanitize(inline ? marked.parseInline(text) : marked.parse(text || '')); return enrich(d); };
  const COLUMNS = [
    { key: 'needs-you', label: 'Needs you', color: '--c-needs' },
    { key: 'doing', label: 'Doing', color: '--c-doing' },
    { key: 'review', label: 'In review', color: '--c-review' },
    { key: 'ready', label: 'Ready to merge', color: '--c-ready' },
    { key: 'done', label: 'Merged', color: '--c-done' }
  ];
  const LIFECYCLE = ['Implement', 'Verify', 'Review', 'Approved', 'Merged'];
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const parse = v => { try { return JSON.parse(v) || []; } catch { return []; } };
  // ponytail: tracked list lives in this browser's localStorage; move to a projects.json if you want it across browsers
  const state = { sessions: [], tracked: parse(store.get('tracked')), project: store.get('project') || 'all', selected: null, chat: store.get('chat'), unfold: new Set(), outbox: [], nudged: new Set() };
  const saveTracked = () => { store.set('tracked', JSON.stringify(state.tracked)); };
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ago = ms => { const s = (Date.now() - ms) / 1000; return s < 60 ? 'now' : s < 3600 ? `${s / 60 | 0}m` : s < 86400 ? `${s / 3600 | 0}h` : `${s / 86400 | 0}d`; };
  const prLabel = url => { const m = url.match(/merge_requests\/(\d+)/) || url.match(/pull\/(\d+)/); return m ? (url.includes('merge_requests') ? '!' : '#') + m[1] : 'PR'; };
  const prChip = s => { const a = el('a', 'chip mono', `${prLabel(s.pr)}${s.prState ? ' · ' + s.prState.state : ''}`); a.href = s.pr; a.target = '_blank'; a.onclick = e => e.stopPropagation(); return a; };

  // Rebuild options only when they changed, and never while the select has focus: touching an open native picker closes it.
  function fillSelect(sel, opts, value) {
    if (document.activeElement === sel) return;
    if (!(sel.options.length === opts.length && [...sel.options].every((o, i) => o.value === opts[i][0] && o.text === opts[i][1]))) {
      sel.replaceChildren(...opts.map(([v, t]) => { const o = el('option', null, t); o.value = v; return o; }));
    }
    if (sel.value !== value) sel.value = value;
  }

  const counts = () => { const c = {}; for (const s of state.sessions) c[s.project] = (c[s.project] || 0) + 1; return c; };

  function renderProjects() {
    if (state.project !== 'all' && !state.tracked.includes(state.project)) state.project = 'all';
    const names = [...state.tracked].sort((a, b) => a.localeCompare(b));
    const opts = [['all', 'All my projects'], ...names.map(n => [n, n])];
    fillSelect($('project'), opts, state.project);
  }

  function renderDialog() {
    const c = counts(), body = $('dlg-body');
    const row = (name, kind) => {
      const r = el('div', 'p-row'), b = el('button', kind, kind === 'add' ? '+ Add' : 'Remove');
      r.append(el('span', null, name), el('small', null, `${c[name] || 0} sessions`), b);
      b.onclick = () => {
        state.tracked = kind === 'add' ? [...state.tracked, name] : state.tracked.filter(p => p !== name);
        saveTracked(); renderDialog(); renderProjects(); renderBoard();
      };
      return r;
    };
    const others = Object.keys(c).filter(p => !state.tracked.includes(p)).sort((a, b) => c[b] - c[a]);
    body.replaceChildren(
      el('h4', null, 'On board'),
      ...(state.tracked.length ? [...state.tracked].sort().map(p => row(p, 'rm')) : [el('div', 'd-empty', 'None yet.')]),
      el('h4', null, 'Seen in recent sessions'),
      ...(others.length ? others.map(p => row(p, 'add')) : [el('div', 'd-empty', 'Nothing else found.')])
    );
  }
  const openDialog = () => { renderDialog(); $('dlg').showModal(); };
  $('manage').onclick = openDialog;

  const COL = Object.fromEntries(COLUMNS.map(c => [c.key, c]));
  const visibleSessions = () => state.sessions.filter(s => state.tracked.includes(s.project) && (state.project === 'all' || s.project === state.project));
  const dot = key => { const d = el('span', 'dot' + (key === 'doing' ? ' live' : '')); d.style.setProperty('--c', `var(${COL[key].color})`); return d; };
  // Work items (one per MR, plus running/stopped agents without one), grouped by what they wait on; merged ones folded at the bottom.
  function renderItems() {
    const items = visibleSessions().flatMap(s => s.items || []).sort((a, b) => b.updated - a.updated);
    const table = list => {
      const t = el('table', 'rows');
      t.append(...list.flatMap(x => {
        const tr = el('tr', state.selected === x.key ? 'sel' : '');
        tr.dataset.key = x.key;
        const what = el('td', 'what');
        what.append(el('b', null, x.title), el('small', 'next', `Next: ${x.next}`));
        const prog = el('td', 'prog'); prog.append(stageBar(x));
        const pr = el('td', 'pr'); if (x.pr) pr.append(prChip(x));
        const br = el('td', 'br'); if (x.branch) br.append(el('span', 'chip mono', x.branch));
        const act = el('td', 'act'); if (x.action && x.sessionId) act.append(actionButton(x));
        tr.append(what, prog, pr, br, act, el('td', 'when', ago(x.updated)));
        tr.onclick = () => select(x);
        if (state.selected !== x.key) return [tr];
        const more = el('tr', 'detail'), td = el('td');
        td.colSpan = 6; td.append(detail(x)); more.append(td);
        return [tr, more];
      }));
      return t;
    };
    const groups = COLUMNS.filter(c => c.key !== 'done').map(c => {
      const list = items.filter(x => x.column === c.key);
      if (!list.length) return null;
      const h = el('h2', 'g-head'); h.append(dot(c.key), `${c.label} · ${list.length}`);
      const sec = el('section', 'group'); sec.append(h, table(list));
      return sec;
    }).filter(Boolean);
    const merged = items.filter(x => x.column === 'done');
    if (merged.length) {
      const fold = el('details', 'group merged'), sum = el('summary', 'g-head');
      sum.append(dot('done'), `Merged (${merged.length})`);
      fold.open = !!state.showMerged;
      fold.ontoggle = () => { state.showMerged = fold.open; };
      fold.append(sum, table(merged));
      groups.push(fold);
    }
    $('masters').replaceChildren(...(items.length ? [yourMoveLine(items)] : []), ...groups);
    if (!groups.length) $('masters').append(el('div', 'welcome', 'Nothing in flight.'));
  }

  // "Your move: merge !1 · address comments on !2 · +2 more"; ranks come from the server's yourMove().
  function yourMoveLine(items) {
    const moves = items.filter(x => x.move).sort((a, b) => a.move.rank - b.move.rank || b.updated - a.updated);
    const line = el('div', 'move');
    if (!moves.length) {
      const doing = items.filter(x => x.column === 'doing').length;
      line.classList.add('muted');
      line.textContent = `Nothing waiting on you — ${items.filter(x => x.column === 'review').length} in review, ${doing} agent${doing === 1 ? '' : 's'} working`;
      return line;
    }
    const SHOW = 3;
    line.append(el('b', null, 'Your move:'), ' ');
    moves.slice(0, SHOW).forEach((x, i) => {
      if (i) line.append(el('span', 'sep-dot', '·'));
      const chip = el('button', x.pr ? 'chip mono' : 'chip', x.pr ? prLabel(x.pr) : x.title);
      chip.title = x.title;
      chip.onclick = () => goTo(x);
      line.append(el('b', null, x.move.action), ' ', chip);
    });
    if (moves.length > SHOW) line.append(el('span', 'sep-dot', '·'), el('span', 'muted', `+${moves.length - SHOW} more`));
    return line;
  }
  // Expand the item's row (without toggling it shut) and bring it into view.
  function goTo(x) {
    if (state.selected !== x.key) select(x);
    document.querySelector(`tr[data-key="${CSS.escape(x.key)}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // First sentence of a message without a TLDR, capped near 200 chars, with dangling ** or ` closed.
  function lead(text) {
    const line = (text || '').split('\n').map(l => l.trim()).find(l => l && !/^(```|\||---|<)/.test(l)) || '';
    const s = line.replace(/^(#+|[-*+>]|\d+[.)])\s+/, '');
    let cut = s.match(/^.+?[.!?](?=\s|$)/)?.[0] ?? s;
    const long = cut.length > 200;
    if (long) cut = cut.slice(0, 200).replace(/\s+\S*$/, '');
    if ((cut.match(/\*\*/g)?.length ?? 0) % 2) cut += '**';
    if ((cut.match(/`/g)?.length ?? 0) % 2) cut += '`';
    return long ? cut + '…' : cut;
  }
  // Collapsed: only the TLDR (or the lead sentence). Show more reveals the rest; open state survives re-renders via state.unfold.
  function foldable(tldr, rest, key) {
    const head = tldr || lead(rest), more = tldr || rest?.trim() !== head ? rest?.trim() : '';
    const top = rich(head, true);
    if (!more) return [top];
    const body = rich(more), btn = el('button', 'show');
    const set = open => { body.hidden = !open; if (!tldr) top.hidden = open; btn.textContent = open ? 'Show less' : 'Show more'; };
    set(state.unfold.has(key));
    btn.onclick = e => { e.stopPropagation(); const open = !state.unfold.has(key); open ? state.unfold.add(key) : state.unfold.delete(key); set(open); };
    return [top, body, btn];
  }

  // The row's one-click command (label and message from the server's rowAction): binds the chat to the item's session and sends there.
  const sentAt = new Map(); // item key -> last click, so a re-render keeps the button disabled
  const COOLDOWN_MS = 3000;
  function actionButton(x) {
    const b = el('button', 'ghost act-btn', x.action.label);
    b.title = x.action.message;
    b.disabled = Date.now() - (sentAt.get(x.key) ?? 0) < COOLDOWN_MS;
    b.onclick = e => {
      e.stopPropagation();
      sentAt.set(x.key, Date.now());
      if (x.sessionId !== chatSession()?.id) bindChat(x.sessionId); else renderBoard();
      setTimeout(renderBoard, COOLDOWN_MS);
      sendText(x.sessionId, x.action.message);
    };
    return b;
  }

  // Click toggles an inline detail (TLDR with Show more, other agents on the item, edited files) and binds the chat to the item's session.
  function select(x) {
    state.selected = state.selected === x.key ? null : x.key;
    if (x.sessionId && x.sessionId !== chatSession()?.id) bindChat(x.sessionId); else renderBoard();
  }
  function detail(x) {
    const d = el('div', 'detail');
    if (x.tldr || x.body) d.append(...foldable(x.tldr, x.body, `item:${x.key}`));
    if (x.activity?.length) {
      const ul = el('ul', 'activity');
      ul.append(...x.activity.map(a => { const li = el('li'); li.append(el('span', 'chip', a.status), ' ', el('b', null, a.description), a.tldr ? ` — ${plain(a.tldr)}` : ''); return li; }));
      d.append(el('h4', null, `Earlier agents · ${x.activity.length}`), ul);
    }
    if (x.files?.length) {
      const ul = el('ul', 'files');
      ul.append(...x.files.map(f => { const li = el('li'), i = f.lastIndexOf('/'); li.title = f; li.append(f.slice(0, i + 1), el('b', null, f.slice(i + 1))); return li; }));
      d.append(el('h4', null, `Files edited · ${x.files.length}`), ul);
    }
    if (!d.children.length) d.append(el('p', 'muted', 'Nothing to show yet.'));
    d.onclick = e => e.stopPropagation();
    return d;
  }
  // Lifecycle Implement → Verify → Review → Approved → Merged; the current segment pulses while an agent runs.
  function stageBar(x) {
    const w = el('div', 'stage'), bar = el('div', 'bar');
    w.style.setProperty('--c', `var(${COL[x.column].color})`);
    LIFECYCLE.forEach((name, i) => { const s = el('i', i < x.stage ? 'on' : i === x.stage ? (x.agentStatus === 'running' ? 'on now' : 'on') : ''); s.title = name; bar.append(s); });
    w.append(bar, el('small', null, x.stageLabel));
    return w;
  }

  function renderBoard() {
    if (!state.tracked.length) {
      const w = el('div', 'welcome'), b = el('button', 'btn', '+ Add projects');
      w.append(el('h2', null, 'No projects on your board'), el('div', null, 'Pick the projects you want to follow. Sessions from other projects stay hidden.'), b);
      b.onclick = openDialog;
      return $('masters').replaceChildren(w);
    }
    renderItems();
  }

  let lastSessions = '', lastRender = 0;
  async function refresh() {
    try {
      const text = await fetch('/api/sessions').then(r => r.text());
      $('offline').hidden = true;
      // ponytail: skip identical re-renders so text in an open detail stays selectable; re-render each minute for the ages
      if (text !== lastSessions || Date.now() - lastRender > 60_000) {
        state.sessions = JSON.parse(text);
        lastSessions = text; lastRender = Date.now();
        renderProjects(); renderBoard();
      }
    } catch { $('offline').hidden = false; }
    refreshChat();
  }

  // Chat column: bound to one master session, default the most recently active tracked one.
  // only sessions in the selected project(s); falls back to the most recent one there
  const chatSession = () => { const v = visibleSessions(); return v.find(s => s.id === state.chat) || v[0] || null; };
  let chatKey = null;

  function bindChat(id) {
    state.chat = id; store.set('chat', id);
    renderBoard(); refreshChat();
  }

  // catch up on updates skipped while the project select had focus
  $('project').onblur = renderProjects;

  function bubble(i, sid) {
    if (i.role === 'tools') return el('div', 'tools', i.text);
    const b = el('div', `bubble ${i.role}${i.error ? ' failed' : ''}`), key = `${sid}:${i.at}`;
    if (i.at) b.title = new Date(i.at).toLocaleString();
    if (i.role === 'assistant') b.append(...foldable(i.tldr, i.text, key));
    else {
      const body = rich(i.text);
      if (!state.unfold.has(key)) body.classList.add('fold');
      b.append(body);
    }
    const note = i.error ? 'Not sent' : i.sending ? 'sending…' : i.pending ? 'queued' : null;
    if (note) {
      const n = el('div', 'b-note', note);
      if (i.pending && !i.sending) {
        const btn = el('button', 'send-now', 'Send now');
        btn.title = "Interrupts Claude's current step so your message is handled now";
        btn.onclick = () => sendNow(sid, key);
        n.append(btn);
      }
      b.append(n);
    }
    b.dataset.key = key;
    return b;
  }

  // "Show more" only where the fold actually cuts something off; needs layout, so runs after insertion.
  function addShowMore(feed) {
    for (const body of feed.querySelectorAll('.body.fold')) {
      if (body.scrollHeight <= body.clientHeight + 4) { body.classList.remove('fold'); continue; }
      const btn = el('button', 'show', 'Show more');
      btn.onclick = () => {
        const key = body.parentElement.dataset.key, open = body.classList.toggle('fold');
        open ? state.unfold.delete(key) : state.unfold.add(key);
        btn.textContent = open ? 'Show more' : 'Show less';
      };
      body.after(btn);
    }
  }

  // same unwrap as the server's unwrapPasted, plus whitespace collapsed, for matching sent text to transcript text
  const norm = t => (t || '').replace(/<pasted_content id="([^"]*)">([\s\S]*?)<\/pasted_content(?: id="\1")?>/g, '$2').replace(/\s+/g, ' ').trim();
  async function refreshChat() {
    const s = chatSession(), feed = $('feed');
    if (!s) { chatKey = null; return feed.replaceChildren(el('div', 'welcome', 'No session to chat with yet.')); }
    let data;
    try {
      const r = await fetch(`/api/transcript?dir=${encodeURIComponent(s.dir)}&id=${encodeURIComponent(s.id)}`);
      if (!r.ok) throw new Error(await r.text());
      data = await r.json();
    } catch { return; }
    if (chatSession()?.id !== s.id) return; // switched while loading
    $('working').hidden = !data.working;
    $('ask').hidden = !data.asking;
    $('ask-q').textContent = data.asking || '';
    $('ask-cmd').textContent = `tmux attach -t cc-${s.id.slice(0, 8)}`;
    // Optimistic bubbles go once any user/queued/pending item has the same text (sent no earlier than 10s before),
    // or 30s after the send succeeded: the transcript is the source of truth.
    const landed = o => data.items.some(i => i.role === 'user' && norm(i.text) === norm(o.text) && !(Date.parse(i.at) < Date.parse(o.at) - 10_000));
    state.outbox = state.outbox.filter(o => o.sid !== s.id || o.error || !(landed(o) || Date.now() - o.okAt > 30_000));
    // placed by send time, so one sent before a queued message stays above it
    // a queued item whose Send now was clicked shows "sending…" until the queue entry resolves
    state.nudged = new Set(data.items.filter(i => i.pending).map(i => `${s.id}:${i.at}`).filter(k => state.nudged.has(k)));
    const items = data.items.map(i => (i.pending && state.nudged.has(`${s.id}:${i.at}`) ? { ...i, sending: true } : i));
    for (const o of state.outbox.filter(o => o.sid === s.id)) {
      const i = items.findIndex(x => Date.parse(x.at) > Date.parse(o.at));
      items.splice(i < 0 ? items.length : i, 0, o);
    }
    const key = s.id + JSON.stringify(items);
    if (key === chatKey) return;
    const fresh = !chatKey?.startsWith(s.id), atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40, top = feed.scrollTop;
    chatKey = key;
    feed.replaceChildren(...items.map(i => bubble(i, s.id)));
    if (!items.length) feed.append(el('div', 'welcome', 'No messages yet.'));
    addShowMore(feed);
    feed.scrollTop = fresh || atBottom ? feed.scrollHeight : top;
  }

  async function sendNow(sid, key) {
    state.nudged.add(key); $('c-err').textContent = ''; refreshChat();
    try {
      const r = await fetch(`/api/interrupt?id=${encodeURIComponent(sid)}`, { method: 'POST', headers: { 'x-codetool': '1' } });
      if (!r.ok) throw new Error(await r.text());
    } catch (err) {
      state.nudged.delete(key); $('c-err').textContent = err.message; refreshChat();
    }
  }

  const syncSend = () => { $('send-btn').disabled = !$('msg').value.trim(); };
  $('msg').oninput = syncSend;

  // Types text into a session as an outbox bubble ("sending…", then gone once the transcript has it); false if it failed.
  async function sendText(sid, text) {
    $('c-err').textContent = '';
    const out = { role: 'user', text, sid, at: new Date().toISOString(), sending: true };
    state.outbox = [...state.outbox.filter(o => !o.error), out];
    refreshChat();
    try {
      const r = await fetch(`/api/send?id=${encodeURIComponent(sid)}`, { method: 'POST', headers: { 'x-codetool': '1', 'content-type': 'text/plain' }, body: text });
      if (!r.ok) throw new Error(await r.text());
      out.okAt = Date.now();
      setTimeout(refreshChat, 1000);
      return true;
    } catch (err) {
      $('c-err').textContent = err.message; out.error = err.message; refreshChat();
      return false;
    }
  }
  $('send').onsubmit = async e => {
    e.preventDefault();
    const s = chatSession(), ta = $('msg'), text = ta.value.trim();
    if (!s || !text) return;
    ta.value = ''; syncSend(); // clear at once; the "sending…" bubble shows progress
    if (!await sendText(s.id, text) && !ta.value) { ta.value = text; syncSend(); } // give the text back so it isn't lost
  };
  $('msg').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('send').requestSubmit(); } };

  $('ask-copy').onclick = () => navigator.clipboard.writeText($('ask-cmd').textContent).then(() => { $('ask-copy').textContent = 'Copied'; setTimeout(() => { $('ask-copy').textContent = 'Copy'; }, 1500); });

  $('project').onchange = e => { state.project = e.target.value; store.set('project', state.project); renderBoard(); refreshChat(); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.selected) { state.selected = null; renderBoard(); }
  });

  refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
