<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="homebase-token" content="__HOMEBASE_TOKEN__">
<meta name="homebase-build" content="__HOMEBASE_BUILD__">
<title>Homebase</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<!-- Web Awesome theme only (no native.css, which would restyle every native element) -->
<link rel="stylesheet" href="/vendor/webawesome/styles/themes/default.css">
<link rel="stylesheet" href="/styles.css">
<!-- Vendored copies, see public/vendor/VENDOR.md. data-webawesome is the loader's base path for lazy-loaded components. -->
<script type="module" src="/vendor/webawesome/webawesome.loader.js" data-webawesome="/vendor/webawesome"></script>
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icon.svg" width="26" height="26" alt="">Homebase</div>
  <span class="sep">/</span>
  <wa-select id="project" size="s" aria-label="Project"></wa-select>
  <span id="milestone-slot"></span><!-- milestone pill goes here (milestoneSelector from milestone.js) -->
  <span class="updated" id="updated" role="status" hidden>Homebase was updated — reload when convenient</span>
  <span class="offline" id="offline" hidden>Offline</span>
  <button class="quiet" id="bell" title="Desktop notifications" aria-label="Desktop notifications" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="b-on"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><circle class="b-dot" cx="18.5" cy="5.5" r="3.5"/></g>
      <g class="b-off"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></g>
    </svg>
  </button>
  <button class="quiet" id="manage" title="Manage projects" aria-label="Manage projects">☰</button>
</header>
<div class="main">
  <div class="left">
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="work" aria-selected="true" title="Work items (1)">Work</button>
      <button role="tab" data-tab="issues" aria-selected="false" title="Milestone issues by person (2)">Issues <span class="count hot" id="tab-free" hidden></span></button>
    </nav>
    <div class="stale-note" role="status">Disconnected — showing the last known data</div>
    <div class="masters" id="masters" role="tabpanel"></div>
    <div class="masters issues" id="issues" role="tabpanel" hidden></div>
    <div class="limits" id="limits" hidden></div>
  </div>
  <aside id="chat">
    <div class="c-head"><wa-dropdown class="c-menu" id="c-menu" placement="bottom-end">
      <button class="quiet" slot="trigger" title="Chat options" aria-label="Chat options">⋯</button>
      <wa-dropdown-item value="view">Clear view<span slot="details">Homebase only</span></wa-dropdown-item>
      <wa-dropdown-item value="new">New conversation (/clear)</wa-dropdown-item>
    </wa-dropdown></div>
    <div class="c-feed" id="feed"></div>
    <form class="c-input" id="send">
      <div class="c-note c-ask" id="ask" hidden><div><b>Claude is asking:</b> <div id="ask-q"></div>Answer from any terminal: <code class="mono" id="ask-cmd"></code></div><wa-button size="s" appearance="outlined" id="ask-copy">Copy</wa-button></div>
      <div class="error" id="c-err"></div>
      <div class="c-status idle" id="status" role="status"><span class="pulse"></span><span id="status-text">Connecting…</span></div>
      <div class="c-row"><wa-textarea id="msg" rows="1" resize="auto" placeholder="Message Claude…"></wa-textarea><button class="c-send" id="send-btn" type="submit" aria-label="Send" title="Send" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    </form>
  </aside>
</div>
<wa-dialog id="clear-dlg" label="Start a fresh conversation?">
  Claude forgets this chat's context.
  <wa-button slot="footer" size="s" appearance="outlined" data-dialog="close">Cancel</wa-button>
  <wa-button slot="footer" size="s" variant="danger" id="clear-go">Start fresh</wa-button>
</wa-dialog>
<wa-dialog id="dlg" label="Projects on your board" light-dismiss>
  <div class="d-body" id="dlg-body"></div>
</wa-dialog>
</body>
</html>
