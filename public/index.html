<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="homebase-token" content="__HOMEBASE_TOKEN__">
<meta name="homebase-build" content="__HOMEBASE_BUILD__">
<title>Homebase</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<!-- PWA: opens standalone from a phone's home screen. Theme colours are --bg in styles.css; use-credentials so a
     pairing cookie reaches the manifest fetch too. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homebase">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<!-- Web Awesome theme only (no native.css, which would restyle every native element) -->
<link rel="stylesheet" href="/vendor/webawesome/styles/themes/default.css">
<link rel="stylesheet" href="/styles.css">
<!-- Vendored copies, see public/vendor/VENDOR.md. data-webawesome is the loader's base path for lazy-loaded components. -->
<script type="module" src="/vendor/webawesome/webawesome.loader.js" data-webawesome="/vendor/webawesome"></script>
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<!-- homebase-web --><!-- the Vue islands (web/README.md), filled in by the server once web/ is built; before app.js, so web/src/old.ts has filled core.js `lib` before the first poll -->
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="sr-only" id="announce" role="status"></div>
<h1 class="sr-only">Homebase</h1>
<header class="top">
  <div class="brand"><img src="/icon.svg" width="26" height="26" alt="">Homebase</div>
  <span class="demo" data-demo hidden title="Invented data: nothing is sent to Claude">Demo</span><!-- shown by the server in --demo -->
  <span class="sep">/</span>
  <!-- the Vue Header island (web/src/islands/Header.vue): project picker, milestone pill, and the update, offline and format notes -->
  <span id="header-island" data-version="__HOMEBASE_CLAUDE_WARN__"></span>
  <span id="bell-host"></span><!-- the Vue Bell island (web/src/islands/Bell.vue) -->
  <button class="quiet" id="reload" aria-label="Refresh from GitLab/GitHub">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <wa-tooltip for="reload" id="reload-tip">Refresh from GitLab/GitHub (r)</wa-tooltip>
  <span id="projects-host"></span><!-- the Vue Projects island: the ☰ button and its dialog (web/src/islands/Projects.vue) -->
</header>
<div class="main">
  <div class="left" role="main">
    <!-- the board's title and view switch (issues.js showTab); phones use the bottom bar instead -->
    <span class="vtitle" id="tabs" role="tablist" aria-label="Board view">
      <button role="tab" id="tab-work" data-tab="work" aria-selected="true" aria-controls="masters" title="Work items (1, or t to swap)"><span class="vt-word">Work</span><span class="count hot work-n" hidden></span></button>
      <button role="tab" id="tab-issues" data-tab="issues" aria-selected="false" aria-controls="issues" tabindex="-1" title="Milestone issues by person (2, or t to swap)"><span class="vt-word">Issues</span></button>
    </span>
    <div class="stale-note" role="status">Disconnected — showing the last known data</div>
    <div class="masters" id="masters" role="tabpanel" aria-labelledby="tab-work"></div>
    <div class="masters issues" id="issues" role="tabpanel" aria-labelledby="tab-issues" hidden></div><!-- the Vue Issues island (web/src/islands/Issues.vue) -->
    <div class="foot"><div class="limits" id="limits" hidden></div><!-- the Vue Limits island (web/src/islands/Limits.vue) --><div class="saver" id="saver"></div><!-- the Token saver switch: the TokenSaver island (web/src/islands/TokenSaver.vue) --></div>
  </div>
  <aside id="chat" aria-label="Chat">
    <div class="c-head"><button class="c-back" id="c-back" type="button" hidden>← Main chat</button><button class="c-back c-next" id="c-next" type="button" hidden></button><span class="c-branch" id="c-branch" hidden></span><span class="c-unpushed" id="c-unpushed" hidden></span><span class="c-newer" id="newer" role="status" hidden><span id="newer-text"></span><button class="show" id="newer-go">Switch</button></span></div>
    <div class="c-focus" id="c-focus" hidden></div>
    <div class="c-feed" id="feed"></div>
    <div class="c-cards">
      <!-- the waiting strip: the Wait island (web/src/islands/Wait.vue) -->
      <div id="wait-host"></div>
      <!-- the question and startup cards and the info line: the Ask island (web/src/islands/Ask.vue) -->
      <div id="asks"></div>
      <!-- the old-rules strip: the Rules island (web/src/islands/Rules.vue) -->
      <div id="rules-host"></div>
    </div>
    <!-- the error line, status line, message box and the chat's dialogs: the Composer island (web/src/islands/Composer.vue) -->
    <div id="composer"></div>
  </aside>
</div>
<!-- narrow windows only (styles.css ≤ 900px: phones, zoomed desktops): one pane at a time, the chat or one of the board's two views -->
<nav class="ptabs" id="ptabs" aria-label="Views">
  <button type="button" data-pane="chat" aria-pressed="true">Chat<span class="pt-dot"><span class="sr-only">, a question is waiting</span></span></button>
  <button type="button" data-pane="work" aria-pressed="false">Work<span class="count hot work-n" id="pt-work-n" hidden></span></button>
  <button type="button" data-pane="issues" aria-pressed="false">Issues</button>
</nav>
<wa-dialog id="log-dlg" label="Activity log" light-dismiss>
  <div class="log" id="log"></div>
</wa-dialog>
<wa-dialog id="pair-dlg" label="Pair a device" light-dismiss>
  <p>On the phone, open Homebase's Tailscale address and type this code. It works once, for 5 minutes.</p>
  <p class="pair-code mono" id="pair-code" aria-live="polite"></p>
  <div class="error" id="pair-err" role="alert"></div>
  <h4>Paired devices</h4>
  <div id="pair-list"></div>
  <wa-button slot="footer" size="s" appearance="outlined" data-dialog="close">Close</wa-button>
  <wa-button slot="footer" size="s" variant="brand" id="pair-new">New code</wa-button>
</wa-dialog>
<span id="new-dlg-host"></span><!-- the Vue NewProject island: the New project dialog (web/src/islands/NewProject.vue) -->
</body>
</html>
